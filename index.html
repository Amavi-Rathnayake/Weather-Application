<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!--Header-->
    
    <div class="container-fluid">
        <div class="main_header_div">

            <div class="left_div">
                <div>
                    <img src="assets/images/cloud.png" width="200px" height="200px" alt="Error">
                 </div>

                <div>
                <h1 class="appname">Atmos</h1>
                </div>
            </div>

            <div class="right_div">
                <div>
                    <input id="header_input" type="text" placeholder="Search here">
                    <button onclick="searchWeather()">Search</button>
                </div>
            </div>

        </div>
    </div>
    <nav>
        <a href="index.html">Home</a>
    </nav>
    <br>

    <div class="main_weather">

    <!-- LEFT SIDE -->
    <div class="weather_div_left">

        <div class="left_weather_div">
            <br><br>
            <img id="state" width="150" src="assets/images/cloudy.png">
            
            <label id="current_temp">x 'c</label>
            <!--<img id="sunstate1" width="80" src="assets/images/sunrise.png">
            <lable>sun rise</lable>-->
        </div>

        <div class="right_weather_div">
            <label id="location">NuwaraEliya</label><br>
            <label id="country">Sri Lanka</label><br>
            <label id="temperature">0'C</label><br>
            <label id="weather_state">Cloudy</label><br>
            <label id="date">16th Nov 2025</label><br>
            <!--<img id="sunstate2" width="80" src="assets/images/sunset.png">
            <br><lable>sun set</lable>-->
        </div>

    </div>

    <!-- RIGHT SIDE BIG BOX -->
    <div class="weather_div_right">
        <h1 class="more">More weather info<br> >>>>>>>>>>>></h1>
        <div class="svg_grid">
        <label class="lblhumidity">Humidity</label>
         <label id="txthumidity">98%</label>
        <img class="svg_images" src="assets/svg/humidity.svg" alt="humidity" height="50px" width="50px">
        <label class="lblpressure">Pressure</label>
        <label id="txtpressure">1011 mb</label>
        <img class="svg_images" src="assets/svg/pressure.svg" alt="pressure" height="50px" width="50px">
        <label class="lbluv">UV</label>
        <label id="txtuv">4</label>
        <img class="svg_images" src="assets/svg/uv-index.svg" alt="uv" height="50px" width="50px">
        <label class="lbltemp">Temperature</label>
        <label id="txttemp">23'c</label>
        <img class="svg_images" src="assets/svg/weather-temperature-thermometer.svg" alt="temperature" height="50px" width="50px">
        <label class="lblwind">Wind</label>
        <label id="txtwind">4 km/h</label>
        <img class="svg_images" src="assets/svg/weather-dust.svg" alt="wind" height="50px" width="50px">
        </div>
    </div>
</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="assets/js/java.js"></script>
</body>
</html>
